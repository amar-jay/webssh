name: Deploy production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pnpm go:test && pnpm go:vet && pnpm check && pnpm -r --if-present test
      - run: pnpm --filter @webssh/web build
      - run: pnpm --filter @webssh/transport test:wasm
      - name: State first, preserve migration history
        run: pnpm --filter @webssh/state exec wrangler deploy
      - name: Web second
        run: pnpm --filter @webssh/web exec wrangler deploy
      - run: node scripts/smoke-production.mjs https://ssh.amarjay.com
      - run: node scripts/probe-relay.mjs
